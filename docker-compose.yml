services:
  postgres:
    image: postgres:16-alpine
    container_name: marketscope-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: marketscope
      POSTGRES_PASSWORD: marketscope
      POSTGRES_DB: marketscope
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketscope -d marketscope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
